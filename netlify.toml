[build]
  publish = "."
  command = ""

# Statiska filer med innehållshash i namnet finns inte här, så HTML får aldrig
# cachas hårt — annars ser besökaren en gammal version efter en deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS och JS byts sällan men måste kunna bytas: en timme i webbläsaren,
# Netlify svarar med 304 därefter.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Bilderna byts bara när jag byter ut dem, och då byter jag filnamn.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# www → apex, en enda kanonisk adress.
[[redirects]]
  from = "https://www.blomstrande.net/*"
  to = "https://blomstrande.net/:splat"
  status = 301
  force = true
